# Visit https://goreleaser.com for documentation on how to customize this
# behavior.
version: 2
before:
  hooks:
    - go mod tidy
    - ./scripts/validate-installers.sh
builds:
  - id: tronador-cli
    env:
      # goreleaser does not work with CGO, it could also complicate
      # installations because users may not have shared libraries available.
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}'
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - '386'
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: '386'
      - goos: windows
        goarch: arm
    binary: 'tronador' #'{{ .ProjectName }}'
archives:
  - id: tronador-cli
    ids:
      - tronador-cli
    formats:
      - zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - README.md
      - src: .cloudopsworks/LICENSE
        dst: LICENSE
nfpms:
  - id: tronador-cli
    ids:
      - tronador-cli
    package_name: tronador-cli
    file_name_template: '{{ .ConventionalFileName }}'
    vendor: CloudOps Works LLC
    homepage: https://github.com/cloudopsworks/tronador-cli
    maintainer: CloudOps Works <info@cloudopsworks.co>
    description: CLI tool for CloudOps Works Tronador workflows and AWS automation
    license: Apache-2.0
    section: utils
    priority: optional
    bindir: /usr/bin
    formats:
      - apk
      - deb
      - rpm
    contents:
      - src: README.md
        dst: /usr/share/doc/tronador-cli/README.md
      - src: .cloudopsworks/LICENSE
        dst: /usr/share/doc/tronador-cli/LICENSE
checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      # If you are using this in a GitHub action or other automated pipeline,
      # pass the batch flag so GPG is not interactive.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
homebrew_casks:
  - name: tronador-cli
    ids:
      - tronador-cli
    repository:
      owner: cloudopsworks
      name: homebrew-tap
      branch: '{{ .ProjectName }}-{{ .Version }}'
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
      pull_request:
        enabled: true
        draft: false
    directory: Casks
    description: CLI tool for CloudOps Works Tronador workflows and AWS automation
    homepage: https://github.com/cloudopsworks/tronador-cli
    license: Apache-2.0
    binaries:
      - tronador
    skip_upload: '{{ not (isEnvSet "HOMEBREW_TAP_TOKEN") }}'
chocolateys:
  - name: tronador-cli
    ids:
      - tronador-cli
    package_source_url: "https://github.com/cloudopsworks/chocolatey-packages"
    owners: "Cloud Ops Works LLC"
    title: "Tronador CLI"
    authors: "Cristian Beraha"
    project_url: "https://cloudopsworks.co/products/#tronador-cli"
    icon_url: "https://cloudopsworks.co/images/logo.png"
    copyright: "Copyright 2026 Cloud Ops Works LLC"
    license_url: "https://github.com/cloudopsworks/tronador-cli/blob/master/LICENSE"
    require_license_acceptance: false
    project_source_url: "https://github.com/cloudopsworks/tronador-cli"
    docs_url: "https://github.com/cloudopsworks/tronador-cli/blob/master/README.md"
    bug_tracker_url: "https://github.com/cloudopsworks/tronador-cli/issues"
    summary: "CLI tool for CloudOps Works Tronador workflows and AWS automation"
    tags: "tronador cli cloudopsworks"
    description: |
      {{ .ProjectName }} is a CLI tool for CloudOps Works Tronador workflows and AWS automation.
      It provides a set of commands to interact with Tronador and perform various tasks related to AWS
      infrastructure management, deployment, and automation. With {{ .ProjectName }}, users can easily
      manage their AWS resources, automate repetitive tasks, and streamline their workflow.
    release_notes: "https://github.com/cloudopsworks/tronador-cli/releases/tag/v{{ .Version }}"
    api_key:  '{{ .Env.CHOCOLATEY_API_KEY }}'
    skip_publish: true
publishers:
  - name: chocolatey-package
    ids:
      - tronador-cli
    cmd: >-
      ./packaging/chocolatey/package.sh --artifact "{{ abs .ArtifactPath }}" --version "{{ .Version }}" --tag "{{ .Tag }}" --out dist/chocolatey
    env:
      - CHOCOLATEY_API_KEY={{ .Env.CHOCOLATEY_API_KEY }}
      - TRONADOR_CHOCOLATEY_PUBLISH=false
release:
  use_existing_draft: true
  extra_files:
    - glob: ./scripts/install.sh
      name_template: install.sh
    - glob: ./scripts/install.ps1
      name_template: install.ps1
  name_template: Release {{ .Tag }}
changelog:
  disable: true
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - tronador-cli
      sign:
        certificate: '{{ .Env.MACOS_SIGN_P12 }}'
        password: '{{ .Env.MACOS_SIGN_PASSWORD }}'
      notarize:
        issuer_id: '{{ .Env.MACOS_NOTARY_ISSUER_ID }}'
        key_id: '{{ .Env.MACOS_NOTARY_KEY_ID }}'
        key: '{{ .Env.MACOS_NOTARY_KEY }}'
        wait: true
        timeout: 20m
