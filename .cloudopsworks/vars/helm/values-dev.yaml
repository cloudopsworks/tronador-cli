# Enable deployment through StatefulSet
# This is useful for applications that require stable network identities and persistent storage.
#statefulset:
#  enabled: true

# Enable deployment through DaemonSet
# This is useful for applications that need to run on every node in the cluster.
#daemonset:
#  enabled: true

# Enable to deploy Kubernetes Job instead of Deployment
#job:
#  enabled: true

# Enable to deploy Kubernetes CronJob instead of Deployment
#cronjob:
#  enabled: true
#  restartPolicy: OnFailure

# Deployment Annotations
#annotations: {}
#  reloader.stakater.com/auto: "true" # Recommended if you are using external_secrets.enabled=true and have installed Stakater Reloader (https://github.com/stakater/Reloader)

# Pod specific Annotations
#podAnnotations: {}
#  instrumentation.opentelemetry.io/inject-go: "true" # Uncomment and remove brackets to enable opentelemetry instrumentation

# Affinity & Antiaffinity configuration for Pods
#affinity: {}

# Node / Pod Tolerations
#tolerations: {}

# Node Selector Affinity
#nodeSelector: {}

# Additional Volume Mounts for Pods
#additionalVolumeMounts: {}

# Additional Volumes allocated to Deployments
#additionalVolumes: {}

# Replicas Required to Run Deployment - only required for Deployment or StatefulSet
#replicaCount: 1

# Deployment Strategy - Defaults to Recreate
#strategy:
#  type: RollingUpdate
#  rollingUpdate:
#    maxSurge: 1
#    maxUnavailable: 1

# define environment variables here as a map of key: value
#env:
#  - name: ENV_VAR_NAME
#    value: "ENV VAR VALUE"
#  ...

# define environment variables to set from ConfigMap / Secret
#envFrom: {}

# Probes: liveness readines and startup
probe:
  path: /healthz
#  port: 8082
startupProbe:
  enabled: true
#livenessProbe: {}
#readinessProbe: {}
# Limits are set outside or off
#resources:
#  limits:
#    cpu: 500m
#    memory: 512Mi
#  requests:
#    cpu: 400m
#    memory: 512Mi

ingress:
  enabled: true
  ingressClassName: nginx
  rules:
    - host: DEV-URL
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: PROJECT_NAME-helm
                port:
                  number: 80

# HorizontalPodAutoscaler
#hpa:
#  enabled: false
#  minReplicas: 2
#  maxReplicas: 6
#  cpuTargetAverageUtilization: 80
#  memoryTargetAverageUtilization: 80
#  # Enable Metrics
#  cpuPercentage: true
#  memoryPercentage: true
#  # Optionals defaults
#  stabilizationWindowSeconds: 300
#  percentValueDown: 40
#  percentPeriodDown: 60
#  percentValueUp: 80
#  percentPeriodUp: 60
#  # External
#  external:
#    enabled: true
#    name: external-metric
#    labelSelector:
#      labelKey: labelValue
#    averageValue: 50

# Service Account
#serviceAccount:
  # Specifies whether a service account should be used, if set true, the service account name should be set
  #enabled: false
  # Specifies whether a service account should be created
  #create: false
  #annotations: {}
  #name: (optional)

