# This file contains the input variables for Elastic Beanstalk deployment.
# Agents: cloud=aws ; cloud_type=beanstalk
environment: "dev|uat|prod|demo"
#runner_set: "RUNNER-ENV" # Optional: when using self-hosted runners
#disable_deploy: true
versions_bucket: "VERSIONS_BUCKET"
#logs_bucket: "LOGS_BUCKET"
#blue_green: true # uncomment for Prod environment to support blue/green deploy
container_registry: REGISTRY # optional if Preview = false, can comment out

aws:
  region: "AWS_REGION"
#  sts_role_arn: "AWS_STS_ROLE_ARN" # Optional: when existing role is same for build and deploy
#  build_sts_role_arn: "BUILD_AWS_STS_ROLE_ARN" # Optional: when existing role is different for build and deploy
#  deploy_sts_role_arn: "DEPLOYMENT_AWS_STS_ROLE_ARN" # Optional: when existing role is different for build and deploy
dns:
  enabled: true
  private_zone: false
  domain_name: DOMAIN_NAME
  alias_prefix: ALIAS_PREFIX
alarms:
  enabled: false
  threshold: 15
  period: 120
  evaluation_periods: 2
  destination_topic: DESTINATION_SNS
api_gateway:
  enabled: false
  vpc_link:
    #link_name: VPC_LINK_NAME # Optional: only valid when existing link is NOT used
    use_existing: false
    #lb_name: LOAD_BALANCER_NAME
    #listener_port: 8443
    #to_port: 443
    #health: # Enable this and below to change the type of healthcheck
    #  enabled: true
    #  protocol: HTTPS
    #  http_status: "200-401"
    #  path: "/"
beanstalk:
  # Solution stack is one of:
  # https://github.com/cloudopsworks/terraform-aws-beanstalk-deploy/blob/v1.3.2/platforms.tf
  # Deploy module v5.2.2: shortcuts select the newest matching stack in the AWS region.
  # A -latest shortcut follows the branch chosen by the module, not necessarily your build runtime.
  # Java and Tomcat:
  #  java          = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Corretto 21$"  # alias for java21
  #  java8_23      = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Corretto 8$"
  #  java11_23     = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Corretto 11$"
  #  java17_23     = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Corretto 17$"
  #  java21        = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Corretto 21$"
  #  java25        = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Corretto 25$"
  #  java-latest   = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Corretto 25$"  # alias for java25
  #  tomcat        = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Tomcat 11 Corretto 21$"  # alias for tomcat11j21
  #  tomcatj17     = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Tomcat [0-9.]+ Corretto 17$"
  #  tomcat9j8     = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Tomcat 9 Corretto 8$"
  #  tomcat9j11    = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Tomcat 9 Corretto 11$"
  #  tomcat9j17    = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Tomcat 9 Corretto 17$"
  #  tomcat10j17   = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Tomcat 10 Corretto 17$"
  #  tomcat10j21   = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Tomcat 10 Corretto 21$"
  #  tomcat11j17   = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Tomcat 11 Corretto 17$"
  #  tomcat11j21   = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Tomcat 11 Corretto 21$"
  #  tomcat11j25   = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Tomcat 11 Corretto 25$"
  #  tomcat-latest = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Tomcat 11 Corretto 25$"  # alias for tomcat11j25
  # Node.js:
  #  node          = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Node[.]js 24$"  # alias for node24
  #  node22        = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Node[.]js 22$"  # AWS scheduled retirement: 2027-07-31
  #  node24        = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Node[.]js 24$"
  #  node26        = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Node[.]js 26$"
  #  node-latest   = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Node[.]js 26$"  # alias for node26
  # Go and containers:
  #  go            = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Go 1$"
  #  docker        = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Docker$"  # alias for docker_al2023
  #  docker_al2023 = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Docker$"
  #  docker-m      = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running ECS$"  # alias for ecs
  #  ecs           = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running ECS$"
  # .NET on Linux:
  #  dotnet        = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running [.]NET 10$"  # alias for dotnet10
  #  dotnet-8      = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running [.]NET 8$"  # AWS scheduled retirement: 2027-03-31
  #  dotnet-9      = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running [.]NET 9$"  # AWS scheduled retirement: 2027-03-31
  #  dotnet10      = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running [.]NET 10$"
  #  dotnet-10     = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running [.]NET 10$"  # alias for dotnet10
  #  dotnet-latest = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running [.]NET 10$"  # alias for dotnet10
  # .NET on Windows Server and Server Core:
  #  dotnet-w19    = "^64bit Windows Server 2019 v[0-9]+([.][0-9]+)+ running IIS 10[.]0$"
  #  dotnet-w22    = "^64bit Windows Server 2022 v[0-9]+([.][0-9]+)+ running IIS 10[.]0$"
  #  dotnet-w25    = "^64bit Windows Server 2025 v[0-9]+([.][0-9]+)+ running IIS 10[.]0$"
  #  net-core-w19  = "^64bit Windows Server Core 2019 v[0-9]+([.][0-9]+)+ running IIS 10[.]0$"
  #  net-core-w22  = "^64bit Windows Server Core 2022 v[0-9]+([.][0-9]+)+ running IIS 10[.]0$"
  #  net-core-w25  = "^64bit Windows Server Core 2025 v[0-9]+([.][0-9]+)+ running IIS 10[.]0$"
  # Python:
  #  python        = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Python 3[.]14$"  # alias for python314
  #  python311     = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Python 3[.]11$"
  #  python312     = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Python 3[.]12$"
  #  python313     = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Python 3[.]13$"
  #  python314     = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Python 3[.]14$"
  #  python315     = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Python 3[.]15$"
  #  python-latest = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Python 3[.]15$"  # alias for python315
  # PHP and Ruby:
  #  php           = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running PHP 8[.]5$"  # alias for php85
  #  php82         = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running PHP 8[.]2$"  # AWS scheduled retirement: 2027-03-31
  #  php83         = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running PHP 8[.]3$"
  #  php84         = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running PHP 8[.]4$"
  #  php85         = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running PHP 8[.]5$"
  #  php-latest    = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running PHP 8[.]5$"  # alias for php85
  #  ruby          = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Ruby 4[.]0$"  # alias for ruby40
  #  ruby33        = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Ruby 3[.]3$"  # AWS scheduled retirement: 2027-07-31
  #  ruby34        = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Ruby 3[.]4$"
  #  ruby40        = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Ruby 4[.]0$"
  #  ruby-latest   = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Ruby 4[.]0$"  # alias for ruby40
  # Deprecated shortcuts (AWS-retired branches). Use only if AWS still lists the stack
  # for your account and region; select a compatible replacement for new environments.
  #  java8         = "^64bit Amazon Linux 2 v[0-9]+([.][0-9]+)+ running Corretto 8$"  # use java8_23
  #  java11        = "^64bit Amazon Linux 2 v[0-9]+([.][0-9]+)+ running Corretto 11$"  # use java11_23
  #  java17        = "^64bit Amazon Linux 2 v[0-9]+([.][0-9]+)+ running Corretto 17$"  # use java17_23
  #  tomcatj8      = "^64bit Amazon Linux 2 v[0-9]+([.][0-9]+)+ running Tomcat [0-9.]+ Corretto 8$"  # use tomcat9j8
  #  tomcatj11     = "^64bit Amazon Linux 2 v[0-9]+([.][0-9]+)+ running Tomcat [0-9.]+ Corretto 11$"  # use tomcat9j11
  #  node20        = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Node[.]js 20$"  # use node24 or node26
  #  node14        = "^64bit Amazon Linux 2 v[0-9]+([.][0-9]+)+ running Node[.]js 14$"  # use node24 or node26
  #  node16        = "^64bit Amazon Linux 2 v[0-9]+([.][0-9]+)+ running Node[.]js 16$"  # use node24 or node26
  #  node18        = "^64bit Amazon Linux 2 v[0-9]+([.][0-9]+)+ running Node[.]js 18$"  # use node24 or node26
  #  node18_23     = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Node[.]js 18$"  # use node24 or node26
  #  go_al2        = "^64bit Amazon Linux 2 v[0-9]+([.][0-9]+)+ running Go 1$"  # use go
  #  dotnet-core   = "^64bit Amazon Linux 2 v[0-9]+([.][0-9]+)+ running [.]NET Core$"  # use dotnet-10
  #  dotnet-6      = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running [.]NET 6$"  # use dotnet-10
  #  dotnet-w16    = "^64bit Windows Server 2016 v[0-9]+([.][0-9]+)+ running IIS 10[.]0$"  # use dotnet-w22 or dotnet-w25
  #  net-core-w16  = "^64bit Windows Server Core 2016 v[0-9]+([.][0-9]+)+ running IIS 10[.]0$"  # use net-core-w22 or net-core-w25
  #  python37      = "^64bit Amazon Linux 2 v[0-9]+([.][0-9]+)+ running Python 3[.]7$"  # use python314
  #  python38      = "^64bit Amazon Linux 2 v[0-9]+([.][0-9]+)+ running Python 3[.]8$"  # use python314
  #  python39      = "^64bit Amazon Linux 2023 v[0-9]+([.][0-9]+)+ running Python 3[.]9$"  # use python314
  # A complete AWS solution stack name pins one version; a custom regex selects the newest match.
  solution_stack: go
  application: APPLICATION
  #wait_for_ready_timeout: "20m"
  iam:
    instance_profile: INSTANCE_PROFILE
    service_role: SERVICE_ROLE
  load_balancer:
    # Shared Load Balancer configuration subset
    #shared:
    #  dns:
    #    enabled: false
    #  enabled: false
    #  name: SHARED_LB_NAME
    #  weight: 100
    public: true
    ssl_certificate_id: SSL_CERTIFICATE_ID
    ssl_policy: ELBSecurityPolicy-2016-08
    alias: LOAD_BALANCER_ALIAS
  instance:
    instance_port: 8080
    enable_spot: true
    default_retention: 90
    volume_size: 20
    volume_type: gp2
    ec2_key: EC2_KEY
    ami_id: AMI_ID
    server_types:
      - SERVER TYPE1
      - SERVER TYPE2
    #pool: # Instance Pool elasticity minimum & maximum number of instances
    #  min: 1
    #  max: 1
  networking:
    private_subnets: []
    public_subnets: []
    vpc_id: VPC_ID
  ##
  # Optional variable for mapping ports to backend ports:
  port_mappings:
    - name: default
      from_port: 80
      to_port: 80
      protocol: HTTP
      health_check: # for custom target group
        enabled: true
        path: "/health"

  ##
  # Optional variable for adding extra tags to the environment
  extra_tags: {}
  #  key: value
  #  key2: value2
  extra_settings:
    - name: "PORT"
      namespace: "aws:elasticbeanstalk:application:environment"
      resource: ""
      value: "8080"
    - name: "Application Healthcheck URL"
      namespace: "aws:elasticbeanstalk:application"
      resource: ""
      value: "/health"
  ##
  # Enable custom shared Rules where below rule mappings mandate over elastic beanstalk configuration.
  #custom_shared_rules: true
  #
  ##
  # Optional Variable for mapping rules for shared Load Balancer
  rule_mappings: []
tags: {}
  #TAG1: value1
  #TAG2: value2