# This file contains the input variables for the Lambda environment.
# Agents: cloud=aws ; cloud_type=lambda
# Before enabling the new trigger, tracing or Scheduler options below, use a
# released Lambda deployment module and a Blueprint pin that supports them.
environment: "dev|uat|prod|demo"
#runner_set: "RUNNER-ENV" # Optional: when using self-hosted runners
#disable_deploy: true
versions_bucket: "VERSIONS_BUCKET"
#logs_bucket: "LOGS_BUCKET"
container_registry: REGISTRY # optional if Preview = false, can comment out
aws:
  region: "AWS_REGION"
#  sts_role_arn: "AWS_STS_ROLE_ARN" # Optional: when existing role is same for build and deploy
#  build_sts_role_arn: "BUILD_AWS_STS_ROLE_ARN" # Optional: when existing role is different for build and deploy
#  deploy_sts_role_arn: "DEPLOYMENT_AWS_STS_ROLE_ARN" # Optional: when existing role is different for build and deploy
lambda:
  arch: x86_64 | arm64
  # Optional: remove the inline {} after iam: before uncommenting any nested keys.
  # The default and dedicated roles both receive required polling and Active X-Ray permissions.
  # S3, SNS, EventBridge rules and Scheduler add their principals automatically.
  # SQS, DynamoDB Streams and Kinesis are polled by the function role, not invoker callers.
  iam: {}
  #  enabled: true
  #  execRole: # List only additional callers; repeating a non-Scheduler trigger removes its role trust source restriction.
  #    enabled: true # Optional with a non-empty list; false disables configured callers, not inferred trigger trust.
  #    principals:
  #      - apigateway.amazonaws.com # Use lambda_exec_role_arn as the API Gateway integration credentials.
  #  policy_attachments:
  #    - arn: arn:aws:iam::123456789012:policy/my-lambda-app-policy # For additional application permissions.
  #  statements:
  #    - effect: Allow # Uncomment below to if vpc.enabled = true
  #      action:
  #        - ec2:CreateNetworkInterface
  #        - ec2:DescribeNetworkInterfaces
  #        - ec2:DeleteNetworkInterface
  #        - ec2:AssignPrivateIpAddresses
  #        - ec2:UnassignPrivateIpAddresses
  #      resource:
  #        - "*"
  #    - effect: Allow # Uncomment below to if vpc.enabled = true
  #      action:
  #        - ec2:DescribeSecurityGroups
  #        - ec2:DescribeSubnets
  #        - ec2:DescribeVpcs
  #      resource:
  #        - "*"
  #    - effect: Allow
  #      action:
  #        - s3:PutObject
  #        - s3:GetObject
  #        - s3:DeleteObject
  #        - s3:ListBucket
  #      resource:
  #        - arn:aws:s3:::<bucket-name>
  #        - arn:aws:s3:::<bucket-name>/*
  #    - effect: Allow
  #      action:
  #        - s3:ListAllMyBuckets
  #      resource:
  #        - "*"
  #    - effect: Allow
  #      action:
  #        - dynamodb:PutItem
  #        - dynamodb:GetItem
  #        - dynamodb:DeleteItem
  #        - dynamodb:UpdateItem
  #        - dynamodb:Scan
  #        - dynamodb:Query
  #      resource:
  #        - arn:aws:dynamodb:<region>:123456789012:table/<dynamodb-table>
  #        - arn:aws:dynamodb:<region>:123456789012:table/<dynamodb-table>/*
  #    - effect: Allow
  #      action:
  #        - dynamodb:ListTables
  #      resource:
  #        - "*"
  environment:
    variables:
      - name: key
        value: value
  handler: index.handler
  runtime: provided.al2023
  #memory_size: 128
  #reserved_concurrency: -1
  #timeout: 3
  # Provisioned concurrency enables if uncomment and set > 1
  #provisioned_concurrent_executions: 1

  ##
  # Optional: if you want to create an alias for the Lambda function
  #alias:
  #  enabled: true
  #  name: "prod" # prod | uat | dev | demo
  #  routing_config:
  #    - version: "1" # Version of the Lambda function
  #      weight: 1.0 # Weight for the routing, can be between 0.0 and 1.0

  ##
  # Optionals: function Urls
  functionUrls: []
  
  ##
  # Optional: EventBridge Scheduler invokes Lambda on a timer; it is not an EventBridge event rule.
  # An invocation role is created automatically when schedules are configured. Scheduler trust is restricted
  # to this account and the selected schedule group. X-Ray is configured on the Lambda below, not on the schedule.
  schedule:
    enabled: false # (optional) Enable the standalone schedule; can be combined with multiple.; # (optional) Enable or disable singe schedule
    #schedule_group: "my-schedule-group" # (optional) Existing group name; omitted or empty creates a dedicated group.
    #flexible:
    #  enabled: true
    #  maxWindow: 20 # Minutes
    expression: "rate(1 hour)" # (optional) Schedule expression (rate, cron, or at); required if enabled is true.; # (optional) Schedule expression, can be cron or rate, required if enabled is true
    #timezone: "America/Sao_Paulo" # IANA time zone; defaults to UTC.
    #suspended: false
    #payload: {job: "hourly"}    # (optional) Payload encoded as JSON; omitted by default.
    #multiple:                    # (optional) Additional schedules for the same Lambda function.
    #  - expression: "rate(1 day)" # (required) Schedule expression for this entry.
    #    flexible:
    #      enabled: true
    #      maxWindow: 20 # Minutes
    #    timezone: "America/Sao_Paulo" # IANA time zone; defaults to UTC.
    #    suspended: false
    #    payload: {job: "daily"} # (optional) Payload encoded as JSON; omitted by default.

  ##
  # VPC configuration for the Lambda function
  vpc:
    enabled: false
    create_security_group: false
    security_groups: []
    subnets: []

  ##
  # Optional: logging config
  #logging:
  #  application_log_level: "INFO"
  #  log_format: JSON | Text
  #  system_log_level: INFO | DEBUG | ERROR

  ##
  # Optional: AWS X-Ray mode is per Lambda function/version, not per trigger.
  # Remove the inline {} after tracing: before uncommenting the keys below.
  # Active samples invocations and automatically grants trace writes to the Lambda execution role,
  # not the Scheduler invoker. Use PassThrough explicitly to switch off previously enabled Active
  # tracing; it forwards trace context without generating automatic Lambda traces.
  tracing: {}
  #  enabled: true # Omit to leave the function's current mode unmanaged.
  #  mode: Active  # Active (default when enabled) or PassThrough.

  ##
  # Optional: Change default lambda ephemeral storage
  #ephemeral_storage:
  #  enabled: true
  #  size: 1024 # Default is 512

  ##
  # Optional: EFS configuration
  #efs:
  #  enabled: true
  #  arn: arn:aws:elasticfilesystem:us-east-1:123456789012:file-system/fs-12345678
  #  local_mount_path: /mnt/efs
  
  ##
  # Optional: bind up to one existing event source per type, in the function's Region.
  # Use sources in the provider's account; SQS queueName and DynamoDB tableName are local-account lookups.
  # Remove the inline {} after triggers: before uncommenting only the bindings you need.
  # Lambda gets polling permissions for SQS, DynamoDB Streams, and Kinesis with either role.
  # Grant any customer-managed KMS key permissions separately. Batch sizes explicitly set above
  # 10 need maximumBatchingWindowInSeconds >= 1; normal SQS FIFO mappings are capped at 10 with no window.
  triggers: {}
  #  s3: # Owns the bucket's entire notification configuration. No automatic object permissions or write-to-invocation trace link.
  #    bucketName: "my-bucket"
  #    sourceAccount: "123456789012" # Defaults to the provider account; for a different owner, set its ID.
  #    # The deployment credentials still need permission to manage that bucket's notification configuration.
  #    events:
  #      - "s3:ObjectCreated:*"
  #    filterPrefix: "OtherLogs/" # Optional; omit for no prefix filter.
  #    filterSuffix: ".log"       # Optional; omit for no suffix filter.
  #  sqs: # A traced producer can use X-Amzn-Trace-Id or the AWSTraceHeader system attribute.
  #    queueName: "orders"
  #    batchSize: 25 # Optional; defaults to 10.
  #    maximumBatchingWindowInSeconds: 1 # Optional, 0-300 seconds; omit for FIFO.
  #    maximumConcurrency: 2 # Optional, 2-1000 concurrent invocations for this mapping.
  #    metricsConfig: true # Optional EventCount metric; defaults to false.
  #    filterCriteria: # Optional; choose pattern_object (as below) or a JSON string under pattern per entry.
  #      - pattern_object:
  #          body:
  #            Location: ["New York"]
  #  dynamodb: # Requires table Streams to be enabled; no automatic writer-to-consumer trace link.
  #    tableName: "orders"
  #    startingPosition: LATEST # LATEST (default) or TRIM_HORIZON.
  #    batchSize: 100 # Optional; defaults to 100.
  #    maximumBatchingWindowInSeconds: 1 # Optional, 0-300 seconds; defaults to 0.
  #    maximumRetryAttempts: 3 # Optional; defaults to -1 (retry until records expire).
  #    metricsConfig: true # Optional EventCount metric; defaults to false.
  #    filterCriteria: # Optional; filter only under the dynamodb key.
  #      - pattern_object:
  #          dynamodb:
  #            Keys:
  #              orderId:
  #                S: ["order-42"]
  #  sns: # An SNS segment requires topic-owner Active tracing and an X-Ray resource policy.
  #    topicArn: "arn:aws:sns:us-east-1:123456789012:orders" # Existing standard topic; no direct FIFO binding.
  #  eventbridge: # Use a traced PutEvents publisher for upstream trace context; not a Scheduler binding.
  #    ruleName: "order-created-to-lambda" # Unique on the existing classic event bus.
  #    eventBusName: "app-events" # Optional; defaults to default.
  #    eventPattern: # Required non-empty YAML object, not a JSON string.
  #      source: ["com.example.orders"]
  #      detail-type: ["OrderCreated"]
  #  kinesis: # Shared-throughput polling; no automatic producer-to-consumer trace link.
  #    streamArn: "arn:aws:kinesis:us-east-1:123456789012:stream/orders" # Stream ARN, not a consumer ARN.
  #    startingPosition: LATEST # LATEST (default) or TRIM_HORIZON.
  #    batchSize: 100 # Optional; defaults to 100.
  #    maximumBatchingWindowInSeconds: 1 # Optional, 0-300 seconds; defaults to 0.
  #    maximumRetryAttempts: 3 # Optional; defaults to -1 (retry until records expire).

  ## Lambda Layers
  layers: []
  ## Others will come later

##
# Optional variable for adding extra tags to the environment
tags: {}
#  key: value
#  key2: value2
